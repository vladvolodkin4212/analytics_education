<script>
const cards = [
{q:"Описательная статистика: среднее, медиана, мода, выбросы, усечённое среднее.",a:"Среднее (mean) — сумма всех значений / количество, чувствительно к выбросам. Медиана — центральное значение при сортировке, устойчива к выбросам. Мода — наиболее часто встречающееся значение, подходит для категориальных данных. Выбросы — значения сильно отклоняющиеся от основной массы, определяют через IQR (Q1 − 1.5*IQR, Q3 + 1.5*IQR) или z-счёт. Усечённое среднее — среднее без k% крайних значений (например, 5% снизу и сверху), устойчиво к выбросам как медиана."},
{q:"Визуализация данных: гистограммы, боксплоты, точечные графики.",a:"Гистограмма — распределение числовых данных, видна форма распределения (нормальное, скошенное, двухмодальное) и наличие выбросов. Боксплот (ящик с усами) — медиана, Q1, Q3, IQR и выбросы, удобен для сравнения групп. Точечный график (Scatterplot) — зависимость между двумя переменными, помогает обнаружить корреляцию и кластеры."},
{q:"Типы критериев: параметрические / непараметрические.",a:"Параметрические тесты предполагают нормальное распределение и работают с числовыми параметрами (среднее, дисперсия): t-test, z-test, ANOVA. Непараметрические не требуют нормальности и работают с рангами или частотами: U-критерий Манна-Уитни, Хи-квадрат. Используют когда данные не нормальны, выборка малая, данные порядковые/категориальные. Их сложнее интерпретировать для бизнеса, поэтому используются редко."},
{q:"Сравнение двух групп: t-test, U-критерий Манна-Уитни, z-test, Хи-квадрат. Как выбрать критерий?",a:"t-test — сравнение средних двух групп, данные нормальные, выборка небольшая. z-test — то же, но выборка большая (n > 30) и дисперсия известна. U-критерий Манна-Уитни — непараметрический аналог t-test, данные не нормальные или порядковые. Хи-квадрат — для категориальных данных."},
{q:"Статистическая значимость и p-value, мощность теста.",a:"p-value — вероятность получить наблюдаемые данные если нулевая гипотеза верна. Если p-value < α (0.05) — отвергаем H0. Ошибка 1-го рода (α) — отвергнуть H0 когда она верна (ложноположительный результат). Ошибка 2-го рода (β) — не отвергнуть H0 когда она ложна (ложноотрицательный результат). Мощность (1−β) — вероятность обнаружить эффект если он есть. Стандартные значения: α = 0.05, мощность = 0.8 (80%)."},
{q:"Доверительные интервалы.",a:"Диапазон значений, в котором с заданной вероятностью (95%) находится истинный параметр генеральной совокупности. Формула: mean ± z * (std / √n). Чем уже доверительный интервал — тем точнее оценка. Если ДИ двух групп не пересекаются — разница статистически значима (но это не то же самое, что p-value)."},
{q:"Полный флоу эксперимента.",a:"1) Гипотеза — формулируем H0 (нет эффекта) и H1 (есть эффект), выбираем метрику и MDE. 2) Дизайн — выбираем критерий, рассчитываем размер выборки, определяем единицу рандомизации (пользователь/сессия/устройство), выбираем длительность. 3) Раскатка — запускаем тест, проверяем AA-тест, следим за сроком. 4) Подведение результатов — применяем критерий, смотрим на p-value, ДИ, абсолютный эффект. 5) Презентация — формулируем вывод (катим/не катим), объясняем экономический эффект и даём рекомендацию."},
{q:"Дизайн эксперимента: описание, размер выборки, метрики, дерево решений.",a:"Дизайн включает: единицу рандомизации (пользователь, сессия, устройство), метрики (goal — целевая, guardrail — защитная, info — информационная), длительность теста, размер выборки. Дерево решений."},
{q:"MDE & Sample Size.",a:"MDE (Minimum Detectable Effect) — минимальный эффект, который мы хотим обнаружить. Чем меньше MDE — тем больше выборка нужна. Sample Size — минимальный размер выборки для достижения заданной мощности и уровня значимости. Зависит от α (0.05), мощности (0.8), MDE и дисперсии метрики. Часто рассчитывают через формулы или специальные калькуляторы."},
{q:"Поправки на множественные сравнения.",a:"При одновременном тестировании нескольких гипотез растёт вероятность ошибки 1-го рода. Поправка Бонферрони — делим α на количество тестов (например, 3 теста → α = 0.05/3 ≈ 0.017), консервативно и снижает мощность. Поправка Бенжамини-Хохберга (FDR) — контролирует долю ложноположительных среди значимых, менее консервативна. Есть ещё поправка Холма."},
{q:"Типы метрик по физическому свойству: Ratio / Per User / Абсолюты.",a:"Абсолюты — суммарные значения (выручка, количество заказов). Просты в вычислении, но чувствительны к изменению трафика. Per User — метрика на пользователя (ARPU, сессий на юзера), устойчива к выбросам. Ratio — отношение двух величин (CTR = клики/показы, Conversion Rate), сложнее в тестировании (нужен дельта-метод/линеаризация или бутстрап)."},
{q:"Типы метрик по дизайну: Goal, Guardrail, Info.",a:"Goal — целевая метрика, которую хотим улучшить (Conversion Rate, Revenue). Guardrail — защитная метрика, которая не должна ухудшаться (CTR, LTV, время загрузки); если она ухудшается — не катим даже если Goal вырос. Info — информационная метрика для понимания контекста (количество пользователей в тесте), не используется для принятия решения."},
{q:"Корреляция: сила и направление связи.",a:"Мера линейной связи между двумя переменными (от -1 до +1). Пирсон — для числовых нормальных данных. Спирмен — непараметрический, для порядковых данных. Сила: 0–0.3 — слабая, 0.3–0.7 — умеренная, >0.7 — сильная. Важно: корреляция ≠ причинность, две переменные могут коррелировать через третий фактор."},
{q:"Регрессия: линейная модель, предсказание, коэффициенты.",a:"Линейная регрессия — модель вида y = a + b*x, описывает линейную зависимость между переменными и позволяет предсказывать значения. Коэффициент b — на сколько изменяется y при изменении x на 1 единицу. R² — доля дисперсии y, объясняемая моделью (0–1, чем выше — тем лучше). Используют для предсказания, оценки влияния факторов и как метод снижения дисперсии в АБ-тестах (CUPED)."},
{q:"Продвинутые методологии: Бутстрап, Бакетизация, Семплирование.",a:"Бутстрап — многократная выборка с возвращением для построения ДИ без предпосылок о распределении данных, спасает когда данные ненормальные, выборка малая или метрика Ratio. Бакетизация — разбивка единиц в бакеты, снижает дисперсию и делает Ratio-метрики приводимыми к t-test. Семплирование — многократная выборка с возвращением и без возвращения."},
{q:"Методы сокращения дисперсии.",a:"Снижение дисперсии увеличивает мощность теста или сокращает нужную выборку. CUPED (Controlled-experiment Using Pre-Experiment Data) — используем доэкспериментальные данные как ковариату для снижения дисперсии. Стратификация — разбивка пользователей на однородные группы, тест внутри каждой. Бакетизация — агрегация пользователей в бакеты. Усечённое среднее — убираем крайние выбросы (убирать выбросы опасно и можно получить неверный результат)."},
{q:"Когда обычный тест провести нельзя: Свичбеки, Региональные тесты, Diff-in-Diff.",a:"Свичбеки (Switchbacks) — единица рандомизации — время, а не пользователь. Используют когда нельзя разделить пользователей (marketplace, rideshare — есть эффект перекрёстного загрязнения). Региональные тесты — единица рандомизации — регион, используют когда нельзя разделить на уровне пользователя. Diff-in-Diff — сравниваем изменение в обеих группах до и после воздействия, позволяет выделить чистый эффект тритмента без полноценной рандомизации."},
{q:"Что такое среднее, медиана и мода? Когда среднее может быть плохой характеристикой?",a:"Среднее — сумма значений / их количество. Медиана — центральное значение при сортировке. Мода — наиболее часто встречающееся значение. Среднее — плохая характеристика, когда: есть выбросы (сильно искажают среднее, медиана устойчива), распределение сильно скошено (доход, время сессии) — среднее не отражает типичного значения, данные мультимодальны (несколько пиков) — среднее может попасть в область без данных."},
{q:"Что такое дисперсия и стандартное отклонение? Как они интерпретируются?",a:"Дисперсия — среднее квадратов отклонений от среднего, показывает разброс данных, но в квадратных единицах. Стандартное отклонение — корень из дисперсии, в тех же единицах, что и исходные данные — поэтому интерпретировать легче. Правило трёх сигм: ≈68% данных в пределах ±1 std, ≈95% в пределах ±2 std (для нормального распределения)."},
{q:"Чем корреляция отличается от причинно-следственной связи?",a:"Корреляция — статистическая связь между двумя переменными, но не говорит о направлении или причине связи. Причинно-следственная связь — изменение одной переменной непосредственно вызывает изменение другой. Корреляция может быть случайной, вызванной третьей переменной (конфаундером), или обратной причинностью. Для доказательства причинности нужен рандомизированный эксперимент (A/B-тест) или causal inference методы (DiD, IV, RDD)."},
{q:"Что такое закон больших чисел?",a:"При увеличении размера выборки выборочное среднее значение стремится к истинному среднему генеральной совокупности. Чем больше наблюдений, тем точнее оценка параметра и меньше влияние случайности/выбросов на итоговый результат."},
{q:"Что такое центральная предельная теорема и почему она важна для A/B-тестов?",a:"ЦПТ — при достаточно большом размере выборки распределение выборочного среднего стремится к нормальному, независимо от формы распределения исходных данных. Важна для A/B-тестов, потому что позволяет применять t-test/z-test (которые предполагают нормальность) даже когда сама метрика распределена ненормально (например, скошенные метрики revenue) — достаточно чтобы выборка была большой."},
{q:"Что такое выборка и генеральная совокупность?",a:"Генеральная совокупность — все объекты/пользователи, о которых мы хотим сделать вывод (например, все пользователи продукта). Выборка — подмножество генеральной совокупности, которое реально наблюдаем и анализируем (например, участники A/B-теста). Задача статистики — сделать обоснованный вывод о генеральной совокупности на основе выборки, важно чтобы выборка была репрезентативной (случайной, не смещённой)."},
{q:"Что такое доверительный интервал? Как его правильно интерпретировать?",a:"Доверительный интервал — диапазон значений, построенный по выборке, который с заданной вероятностью (например 95%) накрывает истинное значение параметра генеральной совокупности. Правильная интерпретация: если повторить эксперимент много раз и каждый раз строить 95% ДИ, то примерно 95% построенных интервалов будут содержать истинное значение. Неправильно говорить «с вероятностью 95% истинное значение лежит в этом интервале» — истинное значение фиксировано, случаен сам интервал."},
{q:"Что означает 95% доверительный интервал?",a:"95% ДИ означает, что если бы мы повторяли эксперимент (сбор выборки и построение ДИ) много раз, то примерно в 95% случаев построенный интервал содержал бы истинное значение параметра генеральной совокупности. Это НЕ означает, что вероятность попадания истинного значения именно в этот конкретный интервал равна 95% — случайна методология построения интервала, а не сам параметр."},
{q:"Чем статистическая значимость отличается от практической/продуктовой значимости?",a:"Статистическая значимость — p-value < α, говорит о том, что эффект вряд ли случаен. Практическая значимость — эффект достаточно большой, чтобы иметь реальную ценность для бизнеса. При очень больших выборках можно получить статистически значимый, но крохотный эффект, который не имеет практической ценности. Поэтому важно смотреть не только на p-value, но и на размер эффекта и сравнивать его с MDE."},
{q:"Что такое ошибка I рода и ошибка II рода?",a:"Ошибка I рода (α, ложноположительный результат) — отвергаем H0, когда она на самом деле верна (говорим что эффект есть, хотя его нет). Ошибка II рода (β, ложноотрицательный результат) — не отвергаем H0, когда она на самом деле ложна (говорим что эффекта нет, хотя он есть). Стандартные значения: α = 0.05, β = 0.2."},
{q:"Что такое статистическая мощность теста?",a:"Мощность (1 − β) — вероятность обнаружить эффект, если он действительно существует. Стандартное значение — 0.8 (80%), означает что в 80% случаев, когда эффект реально есть, тест его обнаружит. Мощность зависит от размера выборки, размера MDE, уровня α и дисперсии метрики."},
{q:"От чего зависит необходимый размер выборки?",a:"Размер выборки зависит от: уровня значимости α (меньше α — больше выборка), желаемой мощности (выше мощность — больше выборка), MDE — минимального детектируемого эффекта (меньше MDE — больше выборка), дисперсии метрики (больше дисперсия — больше выборка). Формула для сравнения средних: n ≈ 2 × (zα/2 + zβ)² × σ² / MDE²."},
{q:"Пайплайн A/B теста.",a:"1) Гипотеза — формулируем H0/H1, выбираем метрику и MDE. 2) Дизайн — единица рандомизации, размер выборки, длительность, критерий. 3) Раскатка — запуск, AA-тест на корректность разбивки, мониторинг SRM. 4) Сбор данных — до достижения нужной длительности, без досрочного подглядывания (peeking). 5) Анализ — применяем критерий, смотрим на p-value, ДИ, размер эффекта. 6) Решение — катим/не катим, оцениваем практическую значимость и риски для guardrail-метрик."},
{q:"Что должно быть определено до запуска эксперимента?",a:"До запуска нужно зафиксировать: гипотезу (H0/H1), основную (goal) и защитные (guardrail) метрики, MDE, уровень значимости α и мощность, размер выборки и длительность теста, единицу рандомизации, критерий для анализа. Это нужно чтобы избежать p-hacking и подгонки анализа под желаемый результат постфактум."},
{q:"Как выбрать основную метрику эксперимента?",a:"Основная (goal) метрика должна: напрямую отражать цель эксперимента и быть связана с North Star Metric продукта, быть чувствительной к изменению (реагировать быстро и заметно), быть измеримой и однозначно определённой, желательно иметь не слишком большую дисперсию (иначе потребуется огромная выборка). Дополнительно определяют guardrail-метрики (не должны ухудшаться) и info-метрики (для контекста)."},
{q:"Что означает результат: p-value = 0.03?",a:"p-value = 0.03 означает, что если бы H0 (эффекта нет) была верна, вероятность получить настолько же или более выраженный эффект, как в наблюдаемых данных, составляет 3%. Поскольку 0.03 < 0.05 (стандартный α), результат считается статистически значимым — отвергаем H0."},
{q:"Если p-value = 0.03, можно ли сказать, что вероятность ошибки составляет 3%?",a:"Нет, это частая ошибка интерпретации. p-value — это вероятность получить такие или более экстремальные данные ПРИ УСЛОВИИ, что H0 верна, а не вероятность того, что H0 верна или что мы совершаем ошибку. Это не то же самое, что вероятность ошибки I рода (α) в глобальном смысле — α фиксируется заранее как порог принятия решения, а p-value — вероятность конкретного результата при предположении об отсутствии эффекта."},
{q:"Если результат статистически незначим, означает ли это, что эффекта нет?",a:"Нет. Незначимый результат означает лишь, что недостаточно доказательств отвергнуть H0 — это может быть из-за того что эффекта действительно нет, либо потому что выборка слишком мала / мощность теста низкая, чтобы обнаружить существующий эффект. «Отсутствие доказательств эффекта» — это не то же, что «доказательство отсутствия эффекта»."},
{q:"Что такое MDE и зачем он нужен?",a:"MDE (Minimum Detectable Effect) — минимальный размер эффекта, который тест способен статистически обнаружить при заданных α, мощности и размере выборки. Также трактуется как минимальный эффект, имеющий практическую ценность для бизнеса и оправдывающий раскатку фичи. MDE нужен для расчёта необходимого размера выборки и длительности эксперимента — без него невозможно спланировать корректный тест."},
{q:"Что произойдёт с мощностью теста, если увеличить размер выборки?",a:"Мощность увеличится — при большем размере выборки снижается дисперсия оценки среднего, что позволяет точнее обнаруживать даже небольшие эффекты, снижая вероятность ошибки II рода (β)."},
{q:"Что произойдёт с длительностью эксперимента, если MDE сделать меньше?",a:"Длительность увеличится. Чем меньше MDE (то есть чем тоньше эффект мы хотим обнаружить), тем больший размер выборки требуется для сохранения нужной мощности, а значит потребуется больше времени для набора этой выборки при фиксированном дневном трафике."},
{q:"Почему нельзя остановить тест сразу, как только p-value стал меньше 0.05?",a:"Потому что p-value колеблется в процессе накопления данных, и при многократной проверке (peeking) резко возрастает вероятность случайно поймать момент, когда p-value < 0.05, даже если реального эффекта нет — это инфляция ошибки I рода. Нужно дождаться заранее рассчитанного размера выборки и проверить результат один раз, либо использовать последовательные методы анализа."},
{q:"Что такое peeking и почему он может приводить к ложноположительным результатам?",a:"Peeking — многократная проверка результатов теста в процессе его проведения (до достижения запланированного размера выборки) с остановкой при первом же значимом результате. Приводит к ложноположительным результатам, потому что каждая проверка — это отдельная попытка отвергнуть H0, и суммарная вероятность хотя бы раз ошибочно увидеть p < 0.05 растёт значительно выше заявленных 5% (может достигать 20–30% при частом подглядывании)."},
{q:"Можно ли запускать A/B-тест до тех пор, пока не получим значимый результат?",a:"Нет, это классическая ошибка p-hacking. Если продолжать тест и проверять результат до появления значимости, вероятность рано или поздно случайно получить p < 0.05 стремится к 100%, даже если реального эффекта не существует. Длительность и размер выборки должны быть зафиксированы заранее, до запуска теста."},
{q:"Что делать, если эксперимент закончился, но статистической значимости нет?",a:"1) Проверить достигнутую мощность/размер выборки — возможно тест был underpowered. 2) Посмотреть на ДИ — если узкий и включает ноль, эффекта скорее всего действительно нет. 3) Если ДИ широкий — может понадобиться больший размер выборки или продление теста. 4) Оценить эффект качественно — если направление правильное, но незначимо — можно рассмотреть повторный тест с большей выборкой. 5) Не катить фичу без доказанного эффекта, либо принять решение основываясь на других факторах."},
{q:"Что такое SRM (Sample Ratio Mismatch)? Например, планировали 50/50, а получили 55/45. Что будете делать?",a:"SRM — несоответствие фактического распределения пользователей по группам запланированному. Проверяется через хи-квадрат тест: если отличие статистически значимо — это сигнал о проблеме в рандомизации или сборе данных. При обнаружении SRM: 1) Не доверять результатам теста, пока проблема не устранена. 2) Проверить логику рандомизации на баги. 3) Проверить не блокируется ли трафик в одной из групп (ботами, кэшированием, редиректами). 4) Проверить корректность логирования событий. 5) Перезапустить тест после исправления причины."},
{q:"Почему рандомизацию лучше делать на уровне пользователя, а не события?",a:"Рандомизация на уровне события может привести к тому, что один и тот же пользователь попадает и в контрольную, и в тестовую группу в разных сессиях/событиях — это создаёт эффект контаминации (взаимного влияния групп) и искажает результат. Рандомизация на уровне пользователя гарантирует, что каждый пользователь стабильно находится в одной группе на протяжении всего теста, что даёт более чистую оценку эффекта."},
{q:"Что происходит, если мы тестируем 20 метрик и одна из них оказалась значимой на уровне 0.05?",a:"При тестировании 20 независимых метрик с α = 0.05 вероятность получить хотя бы один ложноположительный результат = 1 − (1−0.05)^20 ≈ 64%. То есть высока вероятность, что значимый результат по одной из 20 метрик — случайность, а не реальный эффект. Нужно применять поправку на множественные сравнения (Бонферрони, Бенджамини-Хохберг) или заранее выделить одну основную метрику, а остальные рассматривать как info-метрики."},
{q:"Что такое проблема множественных сравнений?",a:"Проблема множественных сравнений — рост вероятности получить хотя бы один ложноположительный результат при одновременной проверке нескольких гипотез (метрик, сегментов, вариантов теста). Решается через поправку Бонферрони (делим α на количество сравнений, консервативно) или поправку Бенджамини-Хохберга (FDR) (контролирует долю ложноположительных среди значимых, менее консервативна)."},
{q:"Как оценивать эффект, если рандомизированный эксперимент невозможен?",a:"Используют методы causal inference: Difference-in-Differences (сравнение изменения метрики до/после в тестовой и контрольной группе), Regression Discontinuity Design (сравнение вокруг порога отсечения), Propensity Score Matching (подбор похожих пользователей из контрольной и тестовой группы по признакам), Instrumental Variables (внешняя переменная, влияющая на treatment, но не напрямую на результат), синтетический контроль (виртуальная контрольная группа из комбинации других единиц)."},
{q:"Что такое CUPED и какую проблему он решает?",a:"CUPED (Controlled-experiment Using Pre-Experiment Data) — метод снижения дисперсии метрики в A/B-тесте за счёт использования данных о поведении пользователя ДО эксперимента как ковариаты. Решает проблему высокой дисперсии метрик (например, revenue), которая требует большой выборки для достижения нужной мощности — CUPED позволяет обнаруживать тот же эффект на меньшей выборке или за меньшее время, не искажая несмещённость оценки эффекта."},
{q:"Что делать, если распределение метрики сильно скошено?",a:"1) Непараметрические критерии (Манна-Уитни) вместо t-test. 2) Бутстрап для построения ДИ без предположений о распределении. 3) Логарифмирование метрики, если это осмысленно (например, revenue). 4) Усечённое среднее (trimmed mean), убирая экстремальные выбросы. 5) Полагаться на ЦПТ — при достаточно большой выборке распределение среднего стремится к нормальному даже для скошенных данных, что позволяет использовать t-test."},
{q:"Когда t-test применять нельзя или нежелательно?",a:"t-test нежелателен, когда: данные сильно скошены и выборка маленькая (ЦПТ ещё не «сработала»), метрика типа Ratio (CTR, Conversion Rate) — требует линеаризации/дельта-метода вместо прямого t-test, есть сильные выбросы, искажающие среднее и дисперсию, данные порядковые/категориальные (лучше Хи-квадрат или Манна-Уитни), нарушено предположение о независимости наблюдений (кластеризованные данные, например несколько сессий одного пользователя)."}
];

let order = cards.map((_, i) => i);
let pos = 0;
let flipped = false;
let known = new Set();
let unknown = new Set();
let finished = false;

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function restart(reshuffle) {
  order = reshuffle ? shuffle(cards.map((_, i) => i)) : cards.map((_, i) => i);
  pos = 0;
  flipped = false;
  known = new Set();
  unknown = new Set();
  finished = false;
  render();
}

function render() {
  const app = document.getElementById('app');

  if (finished) {
    app.innerHTML = `
      <div class="finish">
        <div class="score">Готово: ${cards.length}/${cards.length}</div>
        <div class="detail">Знал: ${known.size} · Стоит повторить: ${unknown.size}</div>
        <div class="actions">
          <button class="primary" id="btn-restart">Пройти заново</button>
          <button id="btn-shuffle">Заново вперемешку</button>
        </div>
        <div class="actions" style="margin-top:8px;">
          <button id="btn-prev-finish">← Вернуться к вопросам</button>
        </div>
      </div>`;
    document.getElementById('btn-restart').onclick = () => restart(false);
    document.getElementById('btn-shuffle').onclick = () => restart(true);
    document.getElementById('btn-prev-finish').onclick = () => { finished = false; pos = order.length - 1; flipped = false; render(); };
    return;
  }

  const idx = order[pos];
  const card = cards[idx];
  const progressPct = Math.round((pos / cards.length) * 100);

  app.innerHTML = `
    <div class="meta-row">
      <span>Вопрос ${pos + 1} из ${cards.length}</span>
      <span>Знал: ${known.size} · Не знал: ${unknown.size}</span>
    </div>
    <div class="progress-track"><div class="progress-fill" style="width:${progressPct}%"></div></div>
    <div class="card ${flipped ? 'answer' : 'question'}" id="card">
      <div class="card-inner">
        <span class="card-label">${flipped ? 'Ответ' : 'Вопрос'}</span>
        <p>${flipped ? card.a : card.q}</p>
      </div>
    </div>
    <div class="actions">
      ${flipped ? '' : '<button class="primary" id="btn-flip">Показать ответ</button>'}
    </div>
    <div class="actions" style="display:${flipped ? 'flex' : 'none'}">
      <button class="known" id="btn-known">✓ Знал</button>
      <button class="unknown" id="btn-unknown">✕ Не знал</button>
    </div>
    <div class="actions" style="margin-top:8px;">
      ${pos > 0 ? '<button id="btn-prev">← Предыдущий вопрос</button>' : ''}
    </div>
  `;

  const cardEl = document.getElementById('card');
  cardEl.onclick = () => { if (!flipped) { flipped = true; render(); } };

  const flipBtn = document.getElementById('btn-flip');
  if (flipBtn) flipBtn.onclick = (e) => { e.stopPropagation(); flipped = true; render(); };

  const knownBtn = document.getElementById('btn-known');
  const unknownBtn = document.getElementById('btn-unknown');
  if (knownBtn) knownBtn.onclick = (e) => { e.stopPropagation(); known.add(idx); unknown.delete(idx); advance(); };
  if (unknownBtn) unknownBtn.onclick = (e) => { e.stopPropagation(); unknown.add(idx); known.delete(idx); advance(); };

  const prevBtn = document.getElementById('btn-prev');
  if (prevBtn) prevBtn.onclick = (e) => { e.stopPropagation(); goBack(); };
}

function advance() {
  if (pos + 1 >= order.length) { finished = true; }
  else { pos += 1; flipped = false; }
  render();
}

function goBack() {
  if (pos > 0) {
    pos -= 1;
    flipped = false;
    render();
  }
}

render();
</script>
