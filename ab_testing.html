<script>
const cards = [
{q:"Описательная статистика: среднее, медиана, мода, выбросы, усечённое среднее. Когда среднее — плохая характеристика?",a:[
"Среднее (mean) — сумма всех значений / количество, чувствительно к выбросам.",
"Медиана — центральное значение при сортировке, устойчива к выбросам.",
"Мода — наиболее часто встречающееся значение, подходит для категориальных данных.",
"Выбросы — значения сильно отклоняющиеся от основной массы данных, определяют через IQR (Q1 − 1.5*IQR, Q3 + 1.5*IQR) или z-счёт.",
"Усечённое среднее — среднее без k% крайних значений, устойчиво к выбросам как медиана.",
"Среднее — плохая характеристика, когда: есть выбросы (сильно искажают среднее, медиана устойчива), распределение сильно скошено (доход, время сессии) — среднее не отражает типичного значения, данные мультимодальны (несколько пиков) — среднее может попасть в область без данных."
]},
{q:"Визуализация данных: гистограммы, боксплоты, точечные графики.",a:[
"Гистограмма — показывает распределение числовых данных, позволяет видеть форму распределения (нормальное, скошенное, двухмодальное) и наличие выбросов.",
"Боксплот (ящик с усами) — показывает медиану, Q1, Q3, IQR и выбросы, удобен для сравнения групп.",
"Точечный график (Scatterplot) — показывает зависимость между двумя переменными, помогает обнаружить корреляцию и кластеры."
]},
{q:"Типы критериев (параметрические/непараметрические), выбор критерия и когда t-test неприменим.",a:[
"Параметрические тесты работают с числовыми параметрами (среднее, дисперсия): t-test, z-test, ANOVA. Непараметрические: U-критерий Манна-Уитни, Хи-квадрат — работают с рангами/частотами и не требуют нормальности исходных данных.",
"Важно: в A/B-тестах мы сравниваем распределение разницы средних между группами — оно всегда стремится к нормальному за счёт ЦПТ, даже если сама метрика (например, ARPU) распределена сильно скошенно. Именно поэтому t-test корректно применяется даже на «ненормальных» метриках вроде ARPU. Выбор статкритерия в A/B-тестах опирается больше на тип метрики, чем на форму исходного распределения.",
"Выбор критерия: t-test — сравнивает средние, применяется когда дисперсия генеральной совокупности неизвестна (оценивается по выборке). z-test — то же самое, но когда дисперсия генеральной совокупности известна. Манна-Уитни — непараметрический аналог t-test, для порядковых/сильно ненормальных данных. Хи-квадрат — сравнивает, насколько наблюдаемые данные отличаются от ожидаемых (например, проверка сплитования: ожидали 50/50, получили 49/51 — норма ли это).",
"t-test нежелателен, когда: метрика типа Ratio (CTR, Conversion Rate — нужна линеаризация/дельта-метод), есть сильные выбросы, искажающие среднее и дисперсию, данные порядковые/категориальные, нарушена независимость наблюдений (кластеризованные данные)."
]},
{q:"Статистическая значимость и p-value: как правильно интерпретировать.",a:[
"p-value — вероятность получить наблюдаемые (или более экстремальные) данные при условии что H0 верна. Если p-value < α — отвергаем H0, результат статистически значим (α — плавающий порог, чаще всего 0.05, но может быть и другим).",
"Например, p-value = 0.03 означает: если бы эффекта не было, вероятность получить такой или более выраженный результат — 3%.",
"Частая ошибка: p-value НЕ равен вероятности того, что H0 верна, и НЕ равен «вероятности ошибки» в широком смысле — это вероятность конкретного результата при предположении об отсутствии эффекта, а не оценка вероятности самой гипотезы."
]},
{q:"Доверительные интервалы: формула и правильная интерпретация.",a:[
"Доверительный интервал — диапазон значений, построенный по выборке, который с заданной вероятностью (например 95%) накрывает истинное значение параметра генеральной совокупности. Формула: mean ± z * (std / √n).",
"Правильная интерпретация 95% ДИ: если повторить эксперимент много раз и каждый раз строить 95% ДИ, то примерно 95% построенных интервалов будут содержать истинное значение. Неправильно говорить «с вероятностью 95% истинное значение лежит в этом интервале» — истинное значение фиксировано, случайна методология построения интервала.",
"Если ДИ двух групп не пересекаются — разница статистически значима, но это не то же самое, что p-value."
]},
{q:"Полный пайплайн эксперимента и что должно быть определено до его запуска.",a:[
"До запуска нужно зафиксировать: гипотезу (H0/H1), основную (goal) и защитные (guardrail) метрики, MDE, уровень значимости α и мощность, размер выборки и длительность, единицу рандомизации, критерий анализа — это защищает от p-hacking и подгонки анализа под желаемый результат постфактум.",
"Флоу: 1) Гипотеза — формулируем H0/H1, выбираем метрику и MDE. 2) Дизайн — критерий, размер выборки, единица рандомизации, длительность. 3) Раскатка — запуск, AA-тест на корректность разбивки, мониторинг SRM.",
"4) Сбор данных — до достижения нужной длительности, без досрочного подглядывания (peeking). 5) Анализ — применяем критерий, смотрим p-value, ДИ, размер эффекта. 6) Решение — катим/не катим, оцениваем практическую значимость и риски для guardrail-метрик."
]},
{q:"MDE и Sample Size: что это и от чего зависит размер выборки.",a:[
"MDE (Minimum Detectable Effect) — минимальный размер эффекта, который тест способен статистически обнаружить, а также минимальный эффект, имеющий практическую ценность для бизнеса. Нужен для расчёта необходимого размера выборки и длительности эксперимента.",
"Размер выборки зависит от: уровня значимости α (меньше α — больше выборка), желаемой мощности (выше мощность — больше выборка), MDE (меньше MDE — больше выборка), дисперсии метрики (больше дисперсия — больше выборка).",
"Формула для сравнения средних: n ≈ 2 × (zα/2 + zβ)² × σ² / MDE²."
]},
{q:"Поправки на множественные сравнения.",a:[
"При одновременной проверке нескольких гипотез (метрик, сегментов, вариантов теста) растёт вероятность хотя бы одного ложноположительного результата. Например, при тестировании 20 метрик с α = 0.05 вероятность получить хотя бы один ложный прокрас = 1 − (1−0.05)^20 ≈ 64%.",
"Решается через: поправку Бонферрони (делим α на количество сравнений, консервативно и снижает мощность) или поправку Бенджамини-Хохберга (FDR) (контролирует долю ложноположительных среди значимых, менее консервативна). Либо заранее выделить одну основную метрику, а остальные рассматривать как info-метрики."
]},
{q:"Типы метрик по физическому свойству: Ratio / Per User / Абсолюты.",a:[
"Абсолюты — суммарные значения (выручка, количество заказов). Просты в вычислении, но чувствительны к изменению трафика.",
"Per User — метрика на пользователя (ARPU, сессий на юзера), устойчива к выбросам.",
"Ratio — отношение двух величин (CTR = клики/показы, Conversion Rate), сложнее в тестировании (нужен дельта-метод/линеаризация или бутстрап)."
]},
{q:"Типы метрик по дизайну (Goal, Guardrail, Info) и как выбрать основную метрику.",a:[
"Goal — целевая метрика, которую хотим улучшить (Conversion Rate, Revenue).",
"Guardrail — защитная метрика, не должна ухудшаться (CTR, LTV, время загрузки) — если ухудшается, не катим даже при росте Goal.",
"Info — информационная метрика для контекста, не используется для решения.",
"Как выбрать основную метрику: должна напрямую отражать цель эксперимента и быть связана с North Star Metric, быть чувствительной к изменению, измеримой и однозначно определённой, желательно иметь не слишком большую дисперсию."
]},
{q:"Корреляция: сила, направление и отличие от причинно-следственной связи.",a:[
"Корреляция — мера линейной связи между двумя переменными (от -1 до +1), но не говорит о направлении или причине связи.",
"Пирсон улавливает только линейную зависимость — если связь выглядит как парабола или другая нелинейная форма, Пирсон может показать корреляцию близкую к нулю, даже при сильной связи. Спирмен, в отличие от Пирсона, улавливает монотонную (в т.ч. нелинейную) связь — считается по рангам, а не по сырым значениям, поэтому подходит и для порядковых данных.",
"Сила: 0–0.3 слабая, 0.3–0.7 умеренная, >0.7 сильная.",
"Причинно-следственная связь — изменение одной переменной непосредственно вызывает изменение другой. Корреляция может быть случайной, вызванной третьей переменной (конфаундером) или обратной причинностью. Для доказательства причинности нужен рандомизированный эксперимент (A/B-тест) или causal inference методы (DiD, IV, RDD)."
]},
{q:"Регрессия: линейная модель, предсказание, коэффициенты.",a:[
"Линейная регрессия — модель вида y = a + b*x, описывает линейную зависимость между переменными и позволяет предсказывать значения.",
"Коэффициент b — на сколько изменяется y при изменении x на 1 единицу. R² — доля дисперсии y, объясняемая моделью (0-1, чем выше — тем лучше).",
"Регрессию используют для предсказания, оценки влияния факторов и как метод снижения дисперсии в АБ-тестах (CUPED)."
]},
{q:"Продвинутые методологии: Бутстрап, Бакетизация, Семплирование.",a:[
"Бутстрап — многократная выборка с возвращением для построения ДИ без предпосылок о распределении данных. Спасает когда данные ненормальные, выборка малая или метрика Ratio, но требует значительных вычислительных мощностей — считается на большом числе повторных выборок.",
"Бакетизация — разбивка единиц в бакеты, снижает дисперсию и делает Ratio-метрики приводимыми к t-test.",
"Семплирование — многократная выборка с возвращением и без возвращения."
]},
{q:"Методы сокращения дисперсии, включая CUPED.",a:[
"Снижение дисперсии увеличивает мощность теста или сокращает нужную выборку.",
"CUPED (Controlled-experiment Using Pre-Experiment Data) — используем данные о поведении пользователя ДО эксперимента как ковариату; решает проблему высокой дисперсии метрик (например revenue), позволяя обнаруживать тот же эффект на меньшей выборке или за меньшее время, не искажая несмещённость оценки.",
"Стратификация — разбивка пользователей на однородные группы, тест внутри каждой. Бакетизация — агрегация пользователей в бакеты. Усечённое среднее — убираем крайние выбросы (убирать выбросы опасно и можно получить неверный результат)."
]},
{q:"Когда обычный тест провести нельзя: Свичбеки, Региональные тесты, Diff-in-Diff.",a:[
"Свичбеки (Switchbacks) — единица рандомизации — время, а не пользователь. Используют когда нельзя разделить пользователей (marketplace, rideshare — есть эффект перекрестного загрязнения).",
"Региональные тесты — единица рандомизации — регион.",
"Diff-in-Diff — сравниваем изменение в обеих группах до и после воздействия, позволяет выделить чистый эффект тритмента без полноценной рандомизации."
]},
{q:"Что такое дисперсия и стандартное отклонение? Как они интерпретируются?",a:[
"Дисперсия — среднее квадратов отклонений от среднего, показывает разброс данных, но в квадратных единицах.",
"Стандартное отклонение — корень из дисперсии, в тех же единицах, что и исходные данные — поэтому интерпретировать легче.",
"Правило трёх сигм: ≈68% данных в пределах ±1 std, ≈95% в пределах ±2 std (для нормального распределения)."
]},
{q:"Что такое закон больших чисел?",a:[
"При увеличении размера выборки выборочное среднее значение стремится к истинному среднему генеральной совокупности.",
"Чем больше наблюдений, тем точнее оценка параметра и меньше влияние случайности/выбросов на итоговый результат."
]},
{q:"Что такое центральная предельная теорема и почему она важна для A/B-тестов?",a:[
"ЦПТ — при достаточно большом размере выборки распределение выборочного среднего стремится к нормальному, независимо от формы распределения исходных данных.",
"Важна для A/B-тестов, потому что позволяет применять t-test/z-test даже когда сама метрика распределена ненормально (например, скошенные метрики revenue) — достаточно чтобы выборка была большой."
]},
{q:"Что такое выборка и генеральная совокупность?",a:[
"Генеральная совокупность — все объекты/пользователи, о которых мы хотим сделать вывод. Выборка — подмножество генеральной совокупности, которое реально наблюдаем и анализируем (например, участники A/B-теста). Важно, чтобы выборка была репрезентативной (случайной, не смещённой).",
"Репрезентативность — свойство выборки корректно отражать структуру генеральной совокупности по ключевым признакам (демография, поведение и т.д.). Достигается случайным отбором без систематических смещений — иначе выводы, сделанные по выборке, нельзя распространять на всю совокупность."
]},
{q:"Чем статистическая значимость отличается от практической/продуктовой значимости?",a:[
"Статистическая значимость — p-value < α, говорит о том, что эффект вряд ли случаен. Практическая значимость — эффект достаточно большой, чтобы иметь реальную ценность для бизнеса.",
"При очень больших выборках можно получить статистически значимый, но крохотный эффект без практической ценности — поэтому важно смотреть не только на p-value, но и на размер эффекта, сравнивая его с MDE."
]},
{q:"Что такое ошибка I рода и ошибка II рода?",a:[
"Ошибка I рода (α, ложноположительный результат) — отвергаем H0, когда она на самом деле верна.",
"Ошибка II рода (β, ложноотрицательный результат) — не отвергаем H0, когда она на самом деле ложна.",
"Стандартные значения: α = 0.05, β = 0.2."
]},
{q:"Что такое статистическая мощность теста?",a:[
"Мощность (1 − β) — вероятность обнаружить эффект, если он действительно существует. Стандартное значение — 0.8 (80%).",
"Зависит от размера выборки, MDE, уровня α и дисперсии метрики."
]},
{q:"Если результат статистически незначим, означает ли это, что эффекта нет?",a:[
"Нет. Незначимый результат означает лишь, что недостаточно доказательств отвергнуть H0 — это может быть из-за того что эффекта действительно нет, либо потому что выборка слишком мала / мощность теста низкая.",
"«Отсутствие доказательств эффекта» — это не то же, что «доказательство отсутствия эффекта»."
]},
{q:"Что произойдёт с мощностью теста, если увеличить размер выборки?",a:[
"Мощность увеличится — при большем размере выборки снижается дисперсия оценки среднего, что позволяет точнее обнаруживать даже небольшие эффекты, снижая вероятность ошибки II рода."
]},
{q:"Что произойдёт с длительностью эксперимента, если MDE сделать меньше?",a:[
"Длительность увеличится. Чем меньше MDE, тем больший размер выборки требуется для сохранения нужной мощности, а значит потребуется больше времени при фиксированном дневном трафике."
]},
{q:"Peeking и досрочная остановка теста.",a:[
"Peeking — многократная проверка результатов теста до достижения запланированного размера выборки, с остановкой при первом значимом результате.",
"Приводит к ложноположительным результатам, так как каждая проверка — отдельная попытка отвергнуть H0, и суммарная вероятность хотя бы раз увидеть p<0.05 растёт значительно выше заявленных 5% (может достигать 20-30%) — это инфляция ошибки I рода.",
"Нельзя останавливать тест сразу как только p-value стал меньше 0.05, и нельзя запускать тест до тех пор, пока не получим значимый результат (классическая ошибка p-hacking) — длительность и размер выборки должны быть зафиксированы заранее, до запуска теста."
]},
{q:"Что делать, если эксперимент закончился, но статистической значимости нет?",a:[
"1) Проверить достигнутую мощность/размер выборки — возможно тест был underpowered.",
"2) Посмотреть на ДИ — если узкий и включает ноль, эффекта скорее всего действительно нет. 3) Если ДИ широкий — может понадобиться больший размер выборки или продление теста.",
"4) Оценить эффект качественно — если направление правильное, но незначимо, можно рассмотреть повторный тест с большей выборкой. 5) Не катить фичу без доказанного эффекта, либо принять решение основываясь на других факторах."
]},
{q:"Что такое SRM (Sample Ratio Mismatch)? Например, планировали 50/50, а получили 55/45. Что будете делать?",a:[
"SRM — несоответствие фактического распределения пользователей по группам запланированному. Проверяется через хи-квадрат тест: если отличие статистически значимо — сигнал о проблеме в рандомизации или сборе данных.",
"При обнаружении SRM: 1) Не доверять результатам теста, пока проблема не устранена. 2) Проверить логику рандомизации на баги. 3) Проверить не блокируется ли трафик в одной из групп (ботами, кэшированием, редиректами). 4) Проверить корректность логирования событий. 5) Перезапустить тест после исправления причины."
]},
{q:"Почему рандомизацию лучше делать на уровне пользователя, а не события?",a:[
"Рандомизация на уровне события может привести к тому, что один и тот же пользователь попадает и в контрольную, и в тестовую группу в разных сессиях/событиях — это создаёт эффект контаминации и искажает результат.",
"Рандомизация на уровне пользователя гарантирует, что каждый пользователь стабильно находится в одной группе на протяжении всего теста, что даёт более чистую оценку эффекта. По той же причине некорректно сплитовать по сессиям — юзер может оказаться в разных группах в разных сессиях, из-за чего группы становятся зависимыми между собой — это ломает предпосылки стат. тестов.",
"Если пользователь как единица плохо определён (например, в офлайн-ритейле), можно выбрать другую стабильную единицу рандомизации — магазин, пункт выдачи и т.п., лишь бы она не пересекалась между группами."
]},
{q:"Как оценивать эффект, если рандомизированный эксперимент невозможен?",a:[
"Используют методы causal inference: Difference-in-Differences (сравнение изменения метрики до/после в тестовой и контрольной группе), Regression Discontinuity Design (сравнение вокруг порога отсечения), Propensity Score Matching (подбор похожих пользователей по признакам), Instrumental Variables (внешняя переменная, влияющая на treatment, но не напрямую на результат), синтетический контроль (виртуальная контрольная группа из комбинации других единиц)."
]},
{q:"Что делать, если распределение метрики сильно скошено?",a:[
"1) Непараметрические критерии (Манна-Уитни) вместо t-test. 2) Бутстрап для построения ДИ без предположений о распределении.",
"3) Логарифмирование метрики, если это осмысленно (например, revenue). 4) Усечённое среднее (trimmed mean), убирая экстремальные выбросы.",
"5) Полагаться на ЦПТ — при достаточно большой выборке распределение среднего стремится к нормальному даже для скошенных данных."
]}
];

let order = cards.map((_, i) => i);
let pos = 0;
let flipped = false;
let known = new Set();
let unknown = new Set();
let finished = false;

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function restart(reshuffle) {
  order = reshuffle ? shuffle(cards.map((_, i) => i)) : cards.map((_, i) => i);
  pos = 0;
  flipped = false;
  known = new Set();
  unknown = new Set();
  finished = false;
  render();
}

function render() {
  const app = document.getElementById('app');

  if (finished) {
    app.innerHTML = `
      <div class="finish">
        <div class="score">Готово: ${cards.length}/${cards.length}</div>
        <div class="detail">Знал: ${known.size} · Стоит повторить: ${unknown.size}</div>
        <div class="actions">
          <button class="primary" id="btn-restart">Пройти заново</button>
          <button id="btn-shuffle">Заново вперемешку</button>
        </div>
        <div class="actions" style="margin-top:8px;">
          <button id="btn-prev-finish">← Вернуться к вопросам</button>
        </div>
      </div>`;
    document.getElementById('btn-restart').onclick = () => restart(false);
    document.getElementById('btn-shuffle').onclick = () => restart(true);
    document.getElementById('btn-prev-finish').onclick = () => { finished = false; pos = order.length - 1; flipped = false; render(); };
    return;
  }

  const idx = order[pos];
  const card = cards[idx];
  const progressPct = Math.round((pos / cards.length) * 100);

  app.innerHTML = `
    <div class="meta-row">
      <span>Вопрос ${pos + 1} из ${cards.length}</span>
      <span>Знал: ${known.size} · Не знал: ${unknown.size}</span>
    </div>
    <div class="progress-track"><div class="progress-fill" style="width:${progressPct}%"></div></div>
    <div class="card ${flipped ? 'answer' : 'question'}" id="card">
      <div class="card-inner">
        <span class="card-label">${flipped ? 'Ответ' : 'Вопрос'}</span>
        ${flipped
          ? card.a.map(para => `<p>${para}</p>`).join('')
          : `<p>${card.q}</p>`}
      </div>
    </div>
    <div class="actions">
      ${flipped ? '' : '<button class="primary" id="btn-flip">Показать ответ</button>'}
    </div>
    <div class="actions" style="display:${flipped ? 'flex' : 'none'}">
      <button class="known" id="btn-known">✓ Знал</button>
      <button class="unknown" id="btn-unknown">✕ Не знал</button>
    </div>
    <div class="actions" style="margin-top:8px;">
      ${pos > 0 ? '<button id="btn-prev">← Предыдущий вопрос</button>' : ''}
    </div>
  `;

  const cardEl = document.getElementById('card');
  cardEl.onclick = () => { if (!flipped) { flipped = true; render(); } };

  const flipBtn = document.getElementById('btn-flip');
  if (flipBtn) flipBtn.onclick = (e) => { e.stopPropagation(); flipped = true; render(); };

  const knownBtn = document.getElementById('btn-known');
  const unknownBtn = document.getElementById('btn-unknown');
  if (knownBtn) knownBtn.onclick = (e) => { e.stopPropagation(); known.add(idx); unknown.delete(idx); advance(); };
  if (unknownBtn) unknownBtn.onclick = (e) => { e.stopPropagation(); unknown.add(idx); known.delete(idx); advance(); };

  const prevBtn = document.getElementById('btn-prev');
  if (prevBtn) prevBtn.onclick = (e) => { e.stopPropagation(); goBack(); };
}

function advance() {
  if (pos + 1 >= order.length) { finished = true; }
  else { pos += 1; flipped = false; }
  render();
}

function goBack() {
  if (pos > 0) {
    pos -= 1;
    flipped = false;
    render();
  }
}

render();
</script>
</body>
</html>
